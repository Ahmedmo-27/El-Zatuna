; PHP settings for DigitalOcean App Platform (and any host that reads .user.ini).
; Prevents 413 "Request Entity Too Large" by raising PHP upload limits.
; Ensure post_max_size >= upload_max_filesize.

upload_max_filesize = 2048M
post_max_size = 2048M
max_execution_time = 300
max_input_time = 300
memory_limit = 256M
