; PHP settings for DigitalOcean App Platform (and any host that reads .user.ini).
; Hard cap: stay within a 512M PHP memory_limit. Large uploads must stream
; (see R2StorageService::putLocalFileToR2) — never load full files into RAM.
; Ensure post_max_size >= upload_max_filesize.

upload_max_filesize = 2048M
post_max_size = 2048M
max_execution_time = 300
max_input_time = 300
memory_limit = 512M
